<!DOCTYPE html>
<html lang="zh-CN">
<!-- 基于 przemyslaw-zan/WT-Tech-Tree-Maker(MIT)的科技树渲染改造:
     移除编辑器/CKEditor/galleria/jQuery/select2 外链,改为数据加载(shop.blkx 管线生成)+
     简中界面+官方 statcard 图+计算层(多目标/最短路径/总账)。上游:https://github.com/przemyslaw-zan/WT-Tech-Tree-Maker -->
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WT 研发点计算器</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="wtrpTop">
	<div class="row" id="countryRow">
		<span class="brand">WT<span>RP</span> 研发点计算器</span>
		<span id="countryTabs" style="display:contents"></span>
		<span class="ver" id="verBadge">加载中…</span>
	</div>
	<div class="row" id="branchRow">
		<span id="branchTabs" style="display:contents"></span>
	</div>
	<div id="wtrpLegend">
		图例:<i style="background:rgb(46,66,80)"></i>科技树
		<i style="background:rgb(60,52,28)"></i>高级(金币)
		<i style="background:rgb(68,48,30)"></i>礼包
		<i style="background:rgb(34,52,72)"></i>市场
		<i style="background:rgb(48,70,44)"></i>中队/活动
		 — 点击载具卡片:查看详情 / 标记<span style="color:var(--wtrp-green)">已拥有 ✓</span> / 加入<span style="color:var(--wtrp-amber)">研发目标</span>(可多选)
	</div>
</div>

<div id="wtrpToggle">计算面板 ▾</div>

<aside id="wtrpPanel"></aside>

<div id="techTreeWrapper">
	<div id="techTree"></div>
</div>

<div id="vehicleDisplayModal" class="modal">
	<div class="modal-content">
		<div class="modal-header">
			<span class="close" id="vPopupClose">&times;</span>
			<h2 id="vPopupTitle"></h2>
		</div>
		<div class="modal-body" id="vPopupBody"></div>
	</div>
</div>

<footer id="wtrpFoot">

	数据与图片经本站 <a href="/wtapi/">/wtapi/</a>(源:<a href="https://github.com/gszabi99/War-Thunder-Datamine" target="_blank" rel="noopener noreferrer">War-Thunder-Datamine</a>)·

</footer>

<script src="script.js"></script>
</body>
</html>
