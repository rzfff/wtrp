<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开发工具:自动点开第一个文件夹(截图验证折叠面板用)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="brand">WT 研发点计算器 <span id="ver" class="ver"></span></div>
  <nav id="nations" class="tabs" aria-label="国家"></nav>
  <nav id="classes" class="tabs" aria-label="兵种"></nav>
  <input id="search" type="search" placeholder="搜索载具名称…" autocomplete="off" aria-label="搜索载具">
</header>
<main>
  <div id="tree-wrap">
    <div id="tree" aria-label="科技树"></div>
    <div id="popover" class="pop hidden" role="dialog"></div>
  </div>
  <aside id="panel">
    <div class="p-head">
      <span id="p-title">已选载具 (0)</span>
      <button id="p-clear" class="btn" type="button">清空</button>
    </div>
    <div id="p-list"></div>
    <div id="p-foot"></div>
  </aside>
</main>
<div id="veil"></div>
<footer id="foot">
  数据源:anhappy /wtapi/ 管线 · <span id="foot-ver"></span>
</footer>
<script src="calc.js"></script>
<script src="app.js"></script>
<script>
// 测试钩子:渲染完成后自动点开第一个文件夹,并把几何结果写进 DOM
(function () {
  const t = setInterval(() => {
    const f = document.querySelector("#tree .folder");
    if (f) {
      clearInterval(t);
      f.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      setTimeout(() => {
        const open = f.classList.contains("open");
        const veil = document.getElementById("veil");
        const top = f.querySelector(":scope > .fstack .card");
        const p = f.querySelector(":scope > .folding-panel");
        const pc = p && p.querySelector(".card");
        const g = { open, veil: veil && veil.classList.contains("show") };
        if (top) { const r = top.getBoundingClientRect(); g.topCard = { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height) }; }
        if (p) { const r = p.getBoundingClientRect(); g.panel = { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height) }; }
        if (pc) { const r = pc.getBoundingClientRect(); g.panelCard1 = { x: Math.round(r.x), y: Math.round(r.y) }; }
        if (top && p) {
          const a = top.getBoundingClientRect(), b = p.getBoundingClientRect(), c = pc.getBoundingClientRect();
          g.haloWrap = b.x < a.x && b.y < a.y && b.right > a.right;         // 面板包住原卡(负偏移+内衬)
          g.firstCardAtOriginalSpot = Math.abs(c.x - a.x) < 6 && Math.abs(c.y - a.y) < 30; // 首卡在原卡位置
          g.panelAboveVeil = getComputedStyle(p).zIndex === "1000" && getComputedStyle(veil).zIndex === "999";
        }
        // v4.6:卡高一致性(普通卡 vs 文件夹顶层卡,取研究区多列样本)
        const hs = new Set();
        for (const col of document.querySelectorAll("#tree .col")) {
          for (const c of col.querySelectorAll(":scope > .card, :scope > .folder .fstack > .card")) {
            hs.add(Math.round(c.getBoundingClientRect().height));
            if (hs.size > 5) break;
          }
          if (hs.size > 5) break;
        }
        g.cardHeights = [...hs];
        // v4.7:列内相邻卡间距一致性(文件夹不再额外下挤,全部应=列 gap 10px)
        const colGaps = new Set();
        for (const col of document.querySelectorAll("#tree .col")) {
          const kids = [...col.children].filter(k => k.getBoundingClientRect().height > 0);
          const rect = kids.map(k => k.getBoundingClientRect());
          for (let i = 1; i < rect.length; i++) colGaps.add(Math.round(rect[i].top - rect[i - 1].bottom));
        }
        g.colGaps = [...colGaps];
        // v5.2:横向溢出验收——科技树区 scrollWidth 不得超出 clientWidth(0=无横滚)
        const wrap = document.getElementById("tree-wrap");
        g.hOverflow = wrap ? wrap.scrollWidth - wrap.clientWidth : null;
        const out = document.createElement("div");
        out.id = "geom";
        out.textContent = "GEOM=" + JSON.stringify(g);
        document.body.appendChild(out);
      }, 400);
    }
  }, 300);
})();
</script>
</body>
</html>
