<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开发工具:自动点开第一个文件夹(截图验证折叠面板用)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="brand">WT 研发点计算器 <span id="ver" class="ver"></span></div>
  <nav id="nations" class="tabs" aria-label="国家"></nav>
  <nav id="classes" class="tabs" aria-label="兵种"></nav>
  <input id="search" type="search" placeholder="搜索载具名称…" autocomplete="off" aria-label="搜索载具">
</header>
<main>
  <div id="tree-wrap">
    <div id="tree" aria-label="科技树"></div>
    <div id="popover" class="pop hidden" role="dialog"></div>
  </div>
  <aside id="panel">
    <div class="p-head">
      <span id="p-title">已选载具 (0)</span>
      <button id="p-clear" class="btn" type="button">清空</button>
    </div>
    <div id="p-list"></div>
    <div id="p-foot"></div>
  </aside>
</main>
<footer id="foot">
  数据源:anhappy /wtapi/ 管线 · <span id="foot-ver"></span>
</footer>
<script src="calc.js"></script>
<script src="app.js"></script>
<script>
// 测试钩子:渲染完成后自动点开第一个文件夹,并把几何结果写进 DOM
(function () {
  const t = setInterval(() => {
    const f = document.querySelector("#tree .folder");
    if (f) {
      clearInterval(t);
      f.dispatchEvent(new MouseEvent("click", { bubbles: true }));
      setTimeout(() => {
        const open = f.classList.contains("open");
        const top = f.querySelector(":scope > .fstack .card");
        const m1 = f.querySelector(":scope > .fold-body .card");
        const g = { open };
        if (top) { const r = top.getBoundingClientRect(); g.topCard = { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height) }; }
        if (m1) { const r = m1.getBoundingClientRect(); g.member1 = { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width) }; }
        if (top && m1) {
          const a = top.getBoundingClientRect(), b = m1.getBoundingClientRect();
          g.memberBelowSameColumn = b.y > a.y && Math.abs(b.x - a.x) < 5 && Math.abs(b.width - a.width) < 5;
        }
        const out = document.createElement("div");
        out.id = "geom";
        out.textContent = "GEOM=" + JSON.stringify(g);
        document.body.appendChild(out);
      }, 400);
    }
  }, 300);
})();
</script>
</body>
</html>
